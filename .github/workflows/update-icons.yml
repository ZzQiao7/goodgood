name: Update Surge Icon Set

on:
  push:
    branches:
      - main
    paths:
      - "**/*.png"
      - "scripts/generate-icons.py"
      - ".github/workflows/update-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-icon-set:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate both Surge icon sets
        run: python3 scripts/generate-icons.py

      - name: Commit changes
        run: |
          if git diff --quiet -- surge-icon.json surge-icons.json; then
            echo "Both Surge icon sets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surge-icon.json surge-icons.json
          git commit -m "chore: update Surge icon set"
          git push
